<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1066" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191116"/>
      <stop offset="35%" stop-color="#120c10"/>
      <stop offset="70%" stop-color="#0a0608"/>
      <stop offset="100%" stop-color="#030203"/>
    </linearGradient>

    <linearGradient id="parchmentLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#f5efe6" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#eadecc" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e6b3"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#f6df9a"/>
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd5e3"/>
      <stop offset="50%" stop-color="#f8c8d8"/>
      <stop offset="100%" stop-color="#e094ac"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f2b5ca" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#f8c8d8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f2b5ca" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1066" rx="36" fill="url(#bgGrad)"/>
  <rect width="800" height="1066" rx="36" fill="url(#ambientGlow)"/>
  <rect width="800" height="1066" rx="36" fill="url(#parchmentLight)"/>

  <!-- Outer Double Gold Inset Borders -->
  <rect x="28" y="28" width="744" height="1010" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="42" y="42" width="716" height="982" rx="18" fill="none" stroke="url(#pinkGrad)" stroke-width="0.8" stroke-dasharray="6,4" stroke-opacity="0.35"/>

  <!-- Ornate Corner Flourishes -->
  <!-- Top Left -->
  <g transform="translate(36, 36)">
    <path d="M0,40 L0,10 Q0,0 10,0 L40,0" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="3" fill="#f8c8d8"/>
    <path d="M5,25 Q12,12 25,5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(764, 36) scale(-1, 1)">
    <path d="M0,40 L0,10 Q0,0 10,0 L40,0" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="3" fill="#f8c8d8"/>
    <path d="M5,25 Q12,12 25,5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(36, 1030) scale(1, -1)">
    <path d="M0,40 L0,10 Q0,0 10,0 L40,0" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="3" fill="#f8c8d8"/>
    <path d="M5,25 Q12,12 25,5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(764, 1030) scale(-1, -1)">
    <path d="M0,40 L0,10 Q0,0 10,0 L40,0" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="3" fill="#f8c8d8"/>
    <path d="M5,25 Q12,12 25,5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Top Header Badge -->
  <g transform="translate(400, 75)">
    <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="12" font-weight="600" fill="#f8c8d8" letter-spacing="4" opacity="0.9">SHAYARI FOLIO • 04 / 06</text>
    <line x1="-120" y1="-4" x2="-60" y2="-4" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="-4" x2="120" y2="-4" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Thematic Visual Motif Section -->
  
      <!-- Sacred Glowing Heart Sanctuary -->
      <g transform="translate(400, 125)" filter="url(#glow)">
        <path d="M0,15 C-25,-15 -50,10 0,45 C50,10 25,-15 0,15 Z" fill="url(#pinkGrad)" opacity="0.85"/>
        <circle cx="0" cy="22" r="2.5" fill="#ffffff" opacity="0.9"/>
      </g>
      <circle cx="340" cy="140" r="1.5" fill="#f8c8d8" opacity="0.5"/>
      <circle cx="460" cy="140" r="1.5" fill="#f8c8d8" opacity="0.5"/>
    

  <!-- Header Flourish Divider -->
  <g transform="translate(400, 220)">
    <line x1="-140" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#f8c8d8" filter="url(#glow)"/>
    <path d="M-8,-6 L0,0 L8,-6 L0,6 Z" fill="url(#goldGrad)" opacity="0.7"/>
    <line x1="20" y1="0" x2="140" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Exact Handwritten Calligraphy Verses -->
  <g id="poetry-text">
    <text x="400" y="330" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Mere liye mohabbat ka</text>
      <text x="400" y="368" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Dusra naam tum ho,</text>
      <text x="400" y="406" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Meri zindagi ka safar tum ho,</text>
      <text x="400" y="444" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Mere dil mein rehne wali</text>
      <text x="400" y="482" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Tum ho,</text>
      <text x="400" y="520" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Meri zindagi ka antim</text>
      <text x="400" y="558" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Samay tum ho,</text>
      <text x="400" y="596" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Mujhe jiske khayal aate</text>
      <text x="400" y="634" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Hain, woh bhi tum ho,</text>
      <text x="400" y="672" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Mere liye sab kuch tum ho,</text>
      <text x="400" y="710" text-anchor="middle" font-family="'Playfair Display', 'Cinzel Decorative', 'Georgia', serif" font-size="21" font-style="italic" font-weight="400" fill="#faf4ec" filter="url(#textShadow)" letter-spacing="0.8">Tum ho.</text>
  </g>

  <!-- Bottom Divider Flourish -->
  <g transform="translate(400, 930)">
    <line x1="-100" y1="0" x2="-15" y2="0" stroke="url(#pinkGrad)" stroke-width="1" opacity="0.4"/>
    <text x="0" y="4" text-anchor="middle" font-size="14" fill="#f8c8d8" opacity="0.9">🧿</text>
    <line x1="15" y1="0" x2="100" y2="0" stroke="url(#pinkGrad)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Bottom Chapter Title -->
  <text x="400" y="975" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" fill="#9c8992" letter-spacing="3" opacity="0.8">IV. SANCTUARY OF LOVE</text>
</svg>